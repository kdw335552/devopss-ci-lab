name: gate
on:
  push:
    branches: [main]        # 브랜치 push로는 돌지 않게 — PR에서 한 번만
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -q -r requirements-dev.txt
      - run: ruff check .
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -q -r requirements-dev.txt
      - name: 테스트 + 커버리지 기준
        run: |
          coverage run -m pytest -q
          coverage report
