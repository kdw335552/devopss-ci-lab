name: secret-demo
on: [push]
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "대상 환경: ${{ vars.TARGET_ENV }}"
          echo "토큰을 그대로 찍으면: ${{ secrets.DEPLOY_TOKEN }}"
          echo "토큰 길이: ${#TOKEN}, 앞 4글자: ${TOKEN:0:4}"
          echo "$TOKEN" | base64
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
