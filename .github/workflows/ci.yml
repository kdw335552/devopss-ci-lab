name: ci
on:
  push:
    paths-ignore: ['**.md']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 의존성 설치
        run: |
          start=$(date +%s); pip install -q -r requirements-dev.txt
          echo "pip 설치 $(( $(date +%s) - start ))초"
      - name: 테스트
        run: pytest -q --junitxml=report-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4     # GitHub은 v4(v3은 2025-01 종료). Gitea는 v3
        with:
          name: report-${{ matrix.python }}
          path: report-${{ matrix.python }}.xml
  report:
    needs: test
    runs-on: ubuntu-latest                   # Gitea의 slim 라벨 대신
    steps:
      - run: echo "모든 파이썬 판에서 통과 — 커밋 ${GITHUB_SHA::7}"
